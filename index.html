<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8467c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="アイカツ配列">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>アイカツ!アンコール 配列トラッカー</title>
<script>
/* 表示テーマ(自動/ライト/ダーク)。画面が一瞬白くならないよう、描画前に決める */
function resolveTheme(t) { return t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
try { var _ui = (JSON.parse(localStorage.getItem('aikatsuHairetsu.v1')) || {}).ui || {}; document.documentElement.dataset.theme = resolveTheme(_ui.theme); } catch (e) { document.documentElement.dataset.theme = resolveTheme('auto'); }
</script>
<style>
:root{
  --accent:#e8467c;--accent-d:#c2305f;--accent-l:#ffe3ee;--head:#e8467c;
  --bg:#f6f2f7;--card:#fff;--surface:#fff;--surface2:#f1eef3;--field:#f7f4f8;
  --ink:#222;--sub:#6b6470;--line:#e0d8e3;--chipline:#bbb;
  --N:#ffffff;--R:#d0d0d0;--PR:#ffe45c;--ER:#9fe0ff;--PRs:#ff9fd0;--ERs:#bf9bff;
  --rink:#222;--rsub:#444;--rowline:rgba(0,0,0,.12);
  --warn-bg:#fff4d6;--warn-line:#f0c94a;--ok:#18794e;--ng:#c0262d;--blue:#1769a8;--blue-bg:#dff1ff;
  --tabh:56px;color-scheme:light;
}
/* ダーク：レアリティの色は同じ系統のまま暗くし、文字を明るくする */
:root[data-theme="dark"]{
  --accent:#e8467c;--accent-d:#ff8fb6;--accent-l:#4a2235;--head:#8f2a52;
  --bg:#141117;--card:#211d25;--surface:#211d25;--surface2:#2c2731;--field:#2c2731;
  --ink:#ece8f0;--sub:#a59fae;--line:#3b3541;--chipline:#5d5666;
  --N:#2d2932;--R:#4c4a53;--PR:#7c6812;--ER:#16607f;--PRs:#8f3367;--ERs:#5c46a0;
  --rink:#f2eef5;--rsub:#d2cbd9;--rowline:rgba(255,255,255,.09);
  --warn-bg:#3b3015;--warn-line:#7a6420;--ok:#4cc38a;--ng:#ff6b6b;--blue:#62b5f2;--blue-bg:#16324a;
  color-scheme:dark;
}
:root[data-theme="dark"] .thumb img{filter:brightness(.92)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  -webkit-text-size-adjust:100%;font-size:15px}
body{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 8px)}
html{touch-action:manipulation}
button,select,input{font:inherit;color:inherit}
/* iPhone は 16px 未満の入力欄をタップすると画面を拡大するので 16px にそろえる */
input,select,textarea{font-size:16px!important}
button,[data-act]{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
small{font-size:.8em}
.hint{color:var(--sub);font-size:13px;margin:6px 0}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:6px 8px;font-size:13px;margin:6px 0}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;background:var(--accent-l);color:var(--accent-d);margin-left:4px;vertical-align:1px;font-weight:600}
.tag.blue{background:var(--blue-bg);color:var(--blue)}
.tag.gray{background:var(--surface2);color:var(--sub)}

/* 色(レアリティ) */
.r-N{background:var(--N)}.r-R{background:var(--R)}.r-PR{background:var(--PR)}
.r-ER{background:var(--ER)}.r-PRs{background:var(--PRs)}.r-ERs{background:var(--ERs)}
.r-N,.r-R,.r-PR,.r-ER,.r-PRs,.r-ERs{color:var(--rink)}

/* 上部 */
#sticky{position:sticky;top:0;z-index:30;background:var(--bg);box-shadow:0 1px 0 var(--line)}
header{display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top));background:var(--head);color:#fff}
header h1{font-size:14px;margin:0;line-height:1.1;flex:0 0 auto}
header select{flex:1 1 auto;min-width:0;height:34px;border:0;border-radius:8px;padding:0 6px;background:var(--surface);color:var(--ink);font-size:14px}
.hbtn{flex:0 0 auto;height:34px;min-width:40px;padding:0 8px;border:0;border-radius:8px;background:rgba(255,255,255,.22);color:#fff;font-size:14px;font-weight:600}
.hbtn:active{background:rgba(255,255,255,.4)}

#next{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 8px 4px}
.np{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;min-width:0}
.np.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.np.auto{border-color:var(--accent);border-style:dashed}
.np-h{display:flex;align-items:center;gap:3px;min-height:30px}
.np-h b{font-size:13px;white-space:nowrap}
.np-h .st{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--accent-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step{flex:0 0 auto;width:32px;height:30px;padding:0;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:13px;font-weight:700}
.step:active{background:var(--accent-l)}
.np-cards{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:3px;align-items:end;margin-top:3px}
.nc{min-width:0;text-align:center}
.nc .thumb{border-width:2px}
.nc.first .thumb{box-shadow:0 0 0 2px var(--accent)}
.nc-l{font-size:10px;color:var(--sub);line-height:1.3}
.nc.first .nc-l{color:var(--accent-d);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:3px}
.stats div{border-radius:5px;text-align:center;font-size:10px;line-height:1.2;padding:2px 0;border:1px solid var(--line)}
.stats b{display:block;font-size:12px}
.nstar{display:flex;align-items:center;gap:4px;margin-top:3px;padding:3px;border-radius:6px;color:var(--rink);min-width:0}
.nstar .thumb{flex:0 0 26px;border-width:1px}
.nstar .thumb .star{font-size:12px}
.nstar .thumb .mtxt{font-size:7px}
.nstar .ns-t{flex:1;min-width:0;line-height:1.2}
.nstar .ns-1{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nstar .ns-2{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nstar .ns-d{flex:0 0 auto;font-size:10px;text-align:center;line-height:1.1}
.nstar .ns-d b{display:block;font-size:15px}
.nstar.none{font-size:11px;color:var(--sub);border:1px dashed var(--line);justify-content:center;padding:6px 3px}
.np-un{font-size:12px;color:var(--sub);padding:6px 2px;min-height:60px}
.np-un .big{font-size:13px;color:var(--ink);font-weight:600}
.np-end{font-size:12px;padding:6px 2px;text-align:center}

/* カード画像 */
.thumb{position:relative;aspect-ratio:5/7;border-radius:5px;overflow:hidden;border:1px solid var(--chipline);background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .fb{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:700;line-height:1.3}
.thumb.noimg .fb{display:flex}
.thumb.noimg img{display:none}
.thumb .star{position:absolute;top:0;right:2px;color:#ff1f84;font-size:20px;line-height:1;text-shadow:0 0 2px #fff,0 0 4px #fff,0 0 1px #fff}
.thumb.multi{display:flex;align-items:center;justify-content:center;text-align:center}
.thumb .mtxt{font-size:10px;font-weight:700;line-height:1.25;padding:2px}

/* 入力バー */
#inbar{display:flex;gap:6px;padding:0 8px 6px}
#inbar{gap:5px}
.seg small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{flex:1;min-width:0;height:44px;border:2px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;font-size:15px;line-height:1.05;padding:0 4px}
.seg small{display:block;font-weight:400;font-size:11px;color:var(--sub)}
.seg.on{border-color:var(--accent);background:var(--accent);color:#fff}
.seg.on small{color:#ffe3ee}
#starBtn{flex:0 0 54px;height:44px;border:2px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;font-size:14px}
#starBtn.on{background:var(--PRs);border-color:#e0559c;color:var(--rink)}
#padBtn{flex:0 0 54px;height:44px;border:2px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;font-size:14px;line-height:1.05}
#padBtn small{font-size:10px}
#padBtn.on{background:var(--accent-l);border-color:var(--accent);color:var(--accent-d)}

/* テンキー */
#pad{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:45;background:var(--surface);border-top:2px solid var(--accent);box-shadow:0 -4px 12px rgba(0,0,0,.12);padding:6px 8px 8px}
body.padopen{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 290px)}
body.padopen #toast{bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 290px)}
.pad-top{display:flex;align-items:center;gap:8px;min-height:62px}
#padPrev{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
#padPrev .thumb{flex:0 0 42px}
#padPrev .pv-no{font-size:26px;font-weight:800;letter-spacing:1px;min-width:2.2em}
#padPrev .pv-nm{font-size:13px;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#padPrev .pv-side{font-size:11px;color:var(--sub)}
.pad-x{flex:0 0 auto;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px}
.pad-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad-keys button{height:48px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:22px;font-weight:700}
.pad-keys button:active{background:var(--accent-l)}
.pad-keys .fn{background:var(--surface2);font-size:18px}
.pad-keys .w2{grid-column:span 2}
.pad-keys .ok{background:var(--accent);border-color:var(--accent);color:#fff;font-size:18px}
.pad-keys .ok:disabled{background:var(--surface2);border-color:var(--line);color:var(--sub)}
#padStar.on{background:var(--PRs);color:var(--rink)}

main{padding:8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.box h3{margin:0 0 6px;font-size:15px}
.btn{min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-weight:600;font-size:14px}
.btn:active{background:var(--accent-l)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--ng);border-color:var(--ng)}
.btn.sm{min-height:32px;padding:3px 10px;font-size:13px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}

/* 特定パネル */
.ib-h{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px}
.recent{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0}
.echip{display:inline-block;font-size:12px;padding:2px 6px;border-radius:6px;border:1px solid var(--chipline);font-weight:600;white-space:nowrap;color:var(--rink)}
.echip.wild{background:var(--surface2);color:var(--sub);border-style:dashed}
.echip.bad{outline:2px solid #e23b3b}
.ib-st{font-size:15px;font-weight:700;margin:6px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ib-st.ok{color:var(--ok)}
.cands{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.cand{display:flex;align-items:center;gap:6px;min-height:44px;padding:4px 10px;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:14px}
.cand b{font-size:17px}
.cand .go{margin-left:auto;font-size:12px;color:var(--accent-d);font-weight:700;white-space:nowrap}
.cand:active{background:var(--accent-l)}
.cand.prio{border-color:var(--accent)}

/* 絞り込み・グリッド */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 8px}
.chip{min-width:44px;height:36px;padding:0 10px;border:1px solid var(--chipline);border-radius:18px;color:var(--rink);font-weight:700;font-size:13px;background:var(--surface)}
.chip.on{outline:3px solid var(--accent);outline-offset:-1px}
.filters input{flex:1 1 150px;min-width:0;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.tile{display:block;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center;min-width:0}
.tile:active{transform:scale(.96);background:var(--accent-l)}
.tile.dis{opacity:.35}
.tile .tl{display:block;font-size:12px;margin-top:2px;white-space:nowrap}
.tile .tl i{font-style:normal;font-size:10px;padding:0 4px;border-radius:4px;border:1px solid var(--chipline)}
.tile .tn{display:block;font-size:10px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 配列表 */
.tctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.tctl select{height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 6px;font-size:13px}
.btn.on{background:var(--accent-l);border-color:var(--accent);color:var(--accent-d)}
.thead,.tcols{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.th{background:var(--surface);border:1px solid var(--line);border-radius:9px 9px 0 0;padding:4px;min-width:0}
.th .tr{display:flex;gap:4px;align-items:center}
.th b{font-size:13px;white-space:nowrap}
.th select{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:14px;font-weight:700}
.th .ts{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcol{position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border:1px solid var(--line);border-top:0;border-radius:0 0 9px 9px;background:var(--surface);height:400px;min-width:0}
.row{display:flex;align-items:center;height:42px;border-bottom:1px solid var(--rowline);padding:0 3px 0 0;position:relative;cursor:pointer;color:var(--rink)}
.row .p{flex:0 0 26px;text-align:center;font-size:11px;font-weight:700;color:var(--rsub)}
.row .c{flex:1;min-width:0;line-height:1.2}
.row .l1{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .l2{font-size:10px;color:var(--rsub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{font-size:10px;font-weight:700;color:var(--rink)}
.row.out{filter:grayscale(1);opacity:.38}
.row.nextc{box-shadow:inset 0 0 0 3px var(--accent);z-index:1}
.row.nextc .p{color:var(--accent-d)}
.row.nextc .p::before{content:"▶";display:block;font-size:9px;line-height:1}
.row.cand::after{content:"候補";position:absolute;right:2px;top:2px;font-size:9px;font-weight:700;color:#fff;background:var(--blue);border-radius:4px;padding:0 3px}
.row.cand{box-shadow:inset 0 0 0 2px var(--blue)}
.row.dim{background:var(--surface2)!important}
.row.dim .c{opacity:.35}
.row .mk{flex:0 0 auto;font-size:12px;font-weight:700;margin-left:2px}
.row .mk.ok{color:var(--ok)}.row .mk.ng{color:var(--ng)}
.row.empty{background:var(--surface2);cursor:default}

/* 検索 */
#q{width:100%;height:46px;border:2px solid var(--line);border-radius:10px;padding:0 12px;font-size:17px;background:var(--surface)}
.sc{display:flex;gap:10px;align-items:flex-start}
.sc .thumb{flex:0 0 96px}
.ptable{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.ptable th,.ptable td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left;vertical-align:top}
.ptable th{white-space:nowrap;width:4.5em}
.ptable .none{color:var(--sub)}
.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin-top:8px}

/* 記録 */
.elist{list-style:none;padding:0;margin:6px 0 0;max-height:360px;overflow:auto}
.elist li{display:flex;align-items:center;gap:6px;padding:5px 2px;border-bottom:1px solid var(--line);font-size:13px}
.elist .ep{flex:0 0 52px;color:var(--sub);font-size:12px}
.elist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.elist .x{flex:0 0 36px;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ng)}
details.box summary{font-weight:600;font-size:14px;cursor:pointer}

/* 設定 */
.form{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin:8px 0;padding:8px;border:1px dashed var(--line);border-radius:9px}
.form label{display:flex;align-items:center;gap:6px;font-size:14px}
.form input,.form select{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--surface)}
#setBox ul{padding-left:1.2em;margin:4px 0;font-size:13px;line-height:1.6}

/* タブバー */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(6,1fr);height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line)}
#tabbar button{border:0;background:none;font-size:12px;padding:0;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
#tabbar button i{font-style:normal;font-size:18px;line-height:1}
#tabbar button.on{color:var(--accent)}

/* トースト・シート */
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 10px);transform:translateX(-50%);z-index:60;max-width:calc(100% - 24px);background:rgba(30,20,35,.92);color:#fff;padding:9px 14px;border-radius:12px;font-size:14px;line-height:1.4;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.show{opacity:1}
.sheet{position:fixed;inset:0;z-index:70}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet-p{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.sheet-p .btn{width:100%;margin-top:8px;min-height:48px;font-size:15px}
/* 期待値 */
.evt{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.evt th,.evt td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.evt th:first-child,.evt td:first-child{text-align:left}
.evt thead th{font-size:11px;color:var(--sub);font-weight:600}
.evt tr.best td{background:var(--accent-l);font-weight:700}
.evt .neg{color:var(--ng)}.evt .pos{color:var(--ok)}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--PRs);vertical-align:middle;margin-right:4px}
.evf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:center;font-size:14px}
.evf input,.evf select{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--surface);width:7.5em;text-align:right}
.evf select{text-align:left;width:auto}
.evf .u{font-size:12px;color:var(--sub);margin-left:2px}
.prow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.prow .thumb{flex:0 0 30px}
.prow .nm{flex:1;min-width:0;font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow input{width:7em;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--surface);text-align:right}
.nst{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.nst > div{border:1px solid var(--line);border-radius:9px;padding:6px;font-size:13px;line-height:1.45}
body.nodata #next,body.nodata #inbar,body.nodata main,body.nodata #tabbar,body.nodata header .hbtn,body.nodata #machineSel{display:none!important}
#nodataBox{margin:12px}
#selftest{white-space:pre-wrap;font-size:12px;background:var(--surface);border:2px solid #333;margin:8px;padding:8px}
</style>
</head>
<body>
<div id="sticky">
  <header>
    <h1>アイカツ!<br>配列</h1>
    <select id="machineSel" aria-label="店舗・筐体"></select>
    <button class="hbtn" data-act="undo" title="元に戻す">↶戻す</button>
    <button class="hbtn" data-act="togglenext" id="nextToggle" title="上の表示をたたむ">▲</button>
  </header>
  <div id="next"></div>
  <div id="inbar">
    <button class="seg" data-act="side" data-side="L">左筒<small id="inL"></small></button>
    <button class="seg" data-act="side" data-side="A">自動<small>左右を判定</small></button>
    <button class="seg" data-act="side" data-side="R">右筒<small id="inR"></small></button>
    <button id="starBtn" data-act="star">★<br><small>パラレル</small></button>
    <button id="padBtn" data-act="pad">⌨<br><small>テンキー</small></button>
  </div>
</div>

<main>
  <section class="tab" id="tab-input">
    <div class="box" id="identBox"></div>
    <div class="filters">
      <div id="rarChips" style="display:flex;gap:4px;flex-wrap:wrap"></div>
      <input id="kw" type="search" enterkeyhint="done" placeholder="番号・名前で絞り込み(1枚ならEnterで記録)" autocomplete="off">
    </div>
    <div id="grid" class="grid"></div>
  </section>

  <section class="tab" id="tab-table" hidden>
    <div class="tctl">
      <button class="btn sm" id="syncBtn" data-act="sync"></button>
      <button class="btn sm" id="alignBtn" data-act="align"></button>
      <select id="rowFilter" aria-label="表示する枠">
        <option value="all">すべて表示</option>
        <option value="R">R以上だけ</option>
        <option value="PR">PR以上だけ</option>
        <option value="ER">ER・★だけ</option>
      </select>
      <button class="btn sm" data-act="jump">目印へ</button>
    </div>
    <div class="thead"><div class="th" id="thL"></div><div class="th" id="thR"></div></div>
    <div class="tcols"><div class="tcol" id="colL"></div><div class="tcol" id="colR"></div></div>
  </section>

  <section class="tab" id="tab-search" hidden>
    <input id="q" type="search" placeholder="例：29 / 1-29 / E1-29 / 35★ / 名前" autocomplete="off">
    <div id="sres"></div>
  </section>

  <section class="tab" id="tab-ev" hidden>
    <div id="evRes"></div>
    <div id="evForm"></div>
  </section>

  <section class="tab" id="tab-log" hidden>
    <div id="logBox"></div>
  </section>

  <section class="tab" id="tab-settings" hidden>
    <div id="setBox"></div>
  </section>
</main>

<nav id="tabbar">
  <button data-act="tab" data-tab="input"><i>✚</i>入力</button>
  <button data-act="tab" data-tab="table"><i>☰</i>配列表</button>
  <button data-act="tab" data-tab="search"><i>⌕</i>検索</button>
  <button data-act="tab" data-tab="ev"><i>¥</i>期待値</button>
  <button data-act="tab" data-tab="log"><i>⏱</i>記録</button>
  <button data-act="tab" data-tab="settings"><i>⚙</i>設定</button>
</nav>

<div id="pad" hidden>
  <div class="pad-top"><div id="padPrev"></div><button class="pad-x" data-act="pad" aria-label="テンキーを閉じる">閉じる</button></div>
  <div class="pad-keys">
    <button data-act="pk" data-k="7">7</button><button data-act="pk" data-k="8">8</button><button data-act="pk" data-k="9">9</button><button data-act="pk" data-k="bs" class="fn">⌫</button>
    <button data-act="pk" data-k="4">4</button><button data-act="pk" data-k="5">5</button><button data-act="pk" data-k="6">6</button><button data-act="pk" data-k="c" class="fn">C</button>
    <button data-act="pk" data-k="1">1</button><button data-act="pk" data-k="2">2</button><button data-act="pk" data-k="3">3</button><button data-act="star" class="fn" id="padStar">★</button>
    <button data-act="pk" data-k="0" class="w2">0</button><button data-act="pk" data-k="ok" class="w2 ok" id="padOk">記録</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-act="closesheet"></div><div class="sheet-p" id="sheetP"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

    var d = document.createElement('div');

})();

  return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
}

/* =========================================================
   データ(弾ごと)
   ========================================================= */
const BUILTIN = parseJSON(document.getElementById('builtin-data').textContent) || { sets: [] };
let dataOverride = parseJSON(lsGet(LS_DATA)) || {};   // { 'E1': {title,notes,cards,arrays} }
let SETS = {};

function prepareSet(raw, id) {
  const cards = (raw.cards || []).map(c => ({ no: c.no, name: c.name, rarity: c.rarity, image: c.image || '' }));
  const byNo = {};
  cards.forEach(c => byNo[c.no] = c);
  const arrays = (raw.arrays || []).map(a => ({ id: a.id, name: a.name || ('配列' + a.id), slots: a.slots.map(s => s.slice()) }));
  const starNos = new Set();
  arrays.forEach(a => a.slots.forEach(s => s.forEach(k => { if (k.endsWith('★')) starNos.add(k.slice(0, -1)); })));
  return { id, title: raw.title || id, notes: raw.notes || [], cards, byNo, arrays, starNos };
}
function setToRaw(set) {
  return {
    title: set.title, notes: set.notes, refPrices: set.ref || undefined,
    cards: set.cards.map(c => ({ no: c.no, name: c.name, rarity: c.rarity, image: c.image })),
    arrays: set.arrays.map(a => ({ id: a.id, name: a.name, slots: a.slots.map(s => s.slice()) }))
  };
}
function buildSets() {
  SETS = {};
  for (const s of BUILTIN.sets) {
    const ov = dataOverride[s.id];
    SETS[s.id] = prepareSet(ov || s, s.id);
    SETS[s.id].ref = (ov && ov.refPrices) || s.refPrices || null;     // 買取価格の参考
  }
  for (const id in dataOverride) if (!SETS[id]) {
    SETS[id] = prepareSet(dataOverride[id], id);
    SETS[id].ref = dataOverride[id].refPrices || null;
  }
}
buildSets();
const firstSetId = () => Object.keys(SETS)[0];

function splitKey(k) { return k && k.endsWith('★') ? { no: k.slice(0, -1), star: true } : { no: k, star: false }; }
function shortNo(k) { return String(k).replace(/^E\d+-/, ''); }
function keyRarity(set, k) {
  const { no, star } = splitKey(k);
  const c = set.byNo[no];
  const r = c ? c.rarity : '?';
  return star ? r + '★' : r;
}
function rcls(r) { return 'r-' + String(r).replace('★', 's'); }
function rvar(r) { return 'var(--' + String(r).replace('★', 's') + ',#eee)'; }
function slotRarities(set, slot) { return [...new Set(slot.map(k => keyRarity(set, k)))]; }
function bgStyle(rs) {
  if (rs.length <= 1) return 'background:' + rvar(rs[0]);
  const step = 100 / rs.length;
  return 'background:linear-gradient(90deg,' + rs.map((r, i) => `${rvar(r)} ${i * step}% ${(i + 1) * step}%`).join(',') + ')';
}
function getArr(set, id) { return set.arrays.find(a => a.id === id) || null; }
function pairId(set, id) {
  if (id == null) return null;
  const p = id % 2 === 1 ? id + 1 : id - 1;
  return set.arrays.some(a => a.id === p) ? p : null;
}
function slotLabel(set, slot) {
  return slot.length === 1 ? slot[0] : '《ランダム》' + (slot.length <= 4 ? slot.join('/') : slot.length + '種');
}
/* 「29」「1-29」「E1-29」「35★」→ {no:'E1-29', star} */
function parseCardNo(q, defSet) {
  const s = String(q || '').normalize('NFKC').replace(/[ー－―‐−–—~〜]/g, '-').replace(/\s+/g, '').toUpperCase();
  const m = s.match(/^(?:E?(\d{1,2})-)?E?(\d{1,3})([★*☆])?$/);
  if (!m) return null;
  const prefix = m[1] ? 'E' + parseInt(m[1], 10) : (defSet || 'E1');
  return { no: prefix + '-' + String(parseInt(m[2], 10)).padStart(2, '0'), star: !!m[3] };
}

/* =========================================================
   状態(店舗・筐体ごと)
   ========================================================= */
function newTube(arrayId) { return { arrayId, confirmed: false, pos: 0, entries: [], fresh: false, history: [], cyl: 1 }; }
function newMachine(name, setId) {
  return { id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, setId, tubes: { L: newTube(1), R: newTube(2) } };
}
function fixMachine(m) {
  if (!m.tubes) m.tubes = { L: newTube(1), R: newTube(2) };
  for (const s of ['L', 'R']) {
    const t = m.tubes[s] = Object.assign(newTube(s === 'L' ? 1 : 2), m.tubes[s] || {});
    if (!Array.isArray(t.entries)) t.entries = [];
    if (!Array.isArray(t.history)) t.history = [];
  }
  if (!SETS[m.setId]) m.setId = firstSetId();
  return m;
}
let store = parseJSON(lsGet(LS_KEY));
if (!store || !Array.isArray(store.machines) || !store.machines.length) {
  const m = newMachine('店舗1', firstSetId());
  store = { machines: [m], cur: m.id, ui: {} };
}
store.machines.forEach(fixMachine);
store.ui = Object.assign({ tab: 'input', side: 'L', sync: true, align: 'marker', theme: 'auto', rowFilter: 'all', rarF: [], starMode: false, nextOpen: true, allCands: false }, store.ui || {});
let undoMap = parseJSON(lsGet(LS_UNDO)) || {};

function M() { return store.machines.find(x => x.id === store.cur) || store.machines[0]; }
function S(m) { return SETS[m.setId] || SETS[firstSetId()]; }

let saveWarned = false;
function save() {
  const ok = lsSet(LS_KEY, JSON.stringify(store)) && lsSet(LS_UNDO, JSON.stringify(undoMap));
  if (!ok && !saveWarned) { saveWarned = true; toast('この端末に保存できませんでした(プライベートモードなど)'); }
}
/* 状態を変える操作はすべてここを通す(取り消しのため) */
function mutate(label, fn) {
  const m = M();
  const snap = JSON.stringify(m);
  const msg = fn(m);
  if (msg === false) return;            // 何も変えなかった
  (undoMap[m.id] = undoMap[m.id] || []).push({ label, snap });
  if (undoMap[m.id].length > UNDO_MAX) undoMap[m.id].shift();
  save();
  render();
  if (msg) toast(msg);
}
function undo() {
  const st = undoMap[M().id];
  if (!st || !st.length) { toast('元に戻せる操作はありません'); return; }
  const { label, snap } = st.pop();
  const restored = fixMachine(JSON.parse(snap));
  const i = store.machines.findIndex(x => x.id === restored.id);
  if (i >= 0) store.machines[i] = restored;
  save(); render(true);
  toast('元に戻しました：' + label);
}

/* =========================================================
   配列の特定
   ========================================================= */
function entryKey(e) { return e && e.no ? e.no + (e.star ? '★' : '') : null; }
/* 記録の並び → [{off, key}](key=null は「不明な1枚」)。確定中に付いた枚数目(pos)があれば間隔に使う */
function seqFromEntries(entries) {
  const seq = [];
  let off = -1, prevPos = null;
  for (const e of entries) {
    if (prevPos != null && e.pos != null && e.pos > prevPos) off += e.pos - prevPos; else off += 1;
    seq.push({ off, key: entryKey(e) });
    prevPos = e.pos != null ? e.pos : null;
  }
  return seq;
}
/* 12配列のすべての位置に当てはめる。maxMis は許す不一致の枚数 */
function findMatches(set, entries, maxMis) {
  const seq = seqFromEntries(entries);
  if (!seq.length) return [];
  const span = seq[seq.length - 1].off + 1;
  const res = [];
  for (const a of set.arrays) {
    const L = a.slots.length;
    for (let s = 0; s + span <= L; s++) {
      let mis = 0, ok = true;
      for (const q of seq) {
        if (!q.key) continue;
        if (!a.slots[s + q.off].includes(q.key)) { if (++mis > maxMis) { ok = false; break; } }
      }
      if (ok) res.push({ arrayId: a.id, start: s + 1, end: s + span, mis });
    }
  }
  return res;
}
function identify(m, side) {
  const set = S(m), t = m.tubes[side], o = m.tubes[OTHER[side]];
  const known = t.entries.filter(e => e.no).length;
  const pairOf = o.confirmed ? pairId(set, o.arrayId) : null;
  if (!known) return { exact: [], near: [], known, pairOf };
  const exact = findMatches(set, t.entries, 0);
  let near = [];
  if (!exact.length && known >= 3) {
    const mx = known >= 6 ? 2 : 1;
    near = findMatches(set, t.entries, mx);
  }
  for (const c of exact.concat(near)) {
    c.pair = c.arrayId === pairOf;
    c.first = c.start === 1;
    c.prio = (t.fresh && c.first ? 0 : 2) + (c.pair ? 0 : 1);
  }
  const cmp = (a, b) => a.mis - b.mis || a.prio - b.prio || a.arrayId - b.arrayId || a.end - b.end;
  exact.sort(cmp); near.sort(cmp);
  return { exact, near: near.slice(0, 12), nearTotal: near.length, known, pairOf };
}
/* 自動で決めてよい候補(1つに決まった/新しい筒で1枚目からの一致が1つ) */
function autoPick(m, side, r) {
  const t = m.tubes[side];
  if (t.confirmed || !r.exact.length) return null;
  if (r.exact.length === 1) return r.exact[0];
  if (t.fresh) {
    const f = r.exact.filter(c => c.first);
    if (f.length === 1) return f[0];
  }
  return null;
}
function mismatches(m, side) {
  const set = S(m), t = m.tubes[side], arr = getArr(set, t.arrayId);
  if (!t.confirmed || !arr) return [];
  return t.entries.filter(e => e.no && e.pos != null && e.pos >= 1 && e.pos <= arr.slots.length && !arr.slots[e.pos - 1].includes(entryKey(e)));
}

/* ---- 状態を変える中身(テストからも呼ぶ) ---- */
function coreConfirm(m, side, arrayId, end) {
  const set = S(m), t = m.tubes[side];
  const seq = seqFromEntries(t.entries);
  const lastOff = seq.length ? seq[seq.length - 1].off : 0;
  t.entries.forEach((e, i) => { const p = end - (lastOff - seq[i].off); e.pos = p >= 1 ? p : undefined; });
  t.arrayId = arrayId; t.confirmed = true; t.pos = end; t.fresh = false;
  const o = m.tubes[OTHER[side]];
  if (!o.confirmed && !o.entries.length) { const p = pairId(set, arrayId); if (p) o.arrayId = p; }
}
function autoIdentify(m, side) {
  const r = identify(m, side);
  const pick = autoPick(m, side, r);
  if (pick) { coreConfirm(m, side, pick.arrayId, pick.end); return `${SIDE[side]}：配列${pick.arrayId}の${pick.end}枚目に特定しました`; }
  if (r.exact.length) return `${SIDE[side]}：候補 ${r.exact.length}件`;
  if (r.near.length) return `${SIDE[side]}：完全に一致する並びなし(近い候補 ${r.nearTotal}件)`;
  return `${SIDE[side]}：一致する並びがありません`;
}
function coreNextCyl(m, side) {
  const t = m.tubes[side];
  t.history.push({ cyl: t.cyl, arrayId: t.arrayId, confirmed: t.confirmed, pos: t.pos, entries: t.entries, ended: Date.now() });
  t.cyl += 1; t.entries = []; t.pos = 0; t.confirmed = false; t.fresh = true;
  return `${SIDE[side]}：第${t.cyl}筒に切り替えました。1枚目から特定し直します`;
}
function coreRecord(m, side, no, star) {
  const set = S(m), t = m.tubes[side];
  let pre = '';
  let arr = getArr(set, t.arrayId);
  if (t.confirmed && arr && t.pos >= arr.slots.length) { coreNextCyl(m, side); pre = '100枚目まで出たので次の筒に切り替えました。'; }
  const e = { no, star: !!star, ts: Date.now() };
  const key = entryKey(e);
  if (t.confirmed && arr) {
    t.pos += 1; e.pos = t.pos; t.entries.push(e);
    const slot = arr.slots[t.pos - 1];
    if (slot.includes(key)) return pre + `${SIDE[side]} ${t.pos}枚目：${key}`;
    return pre + `⚠ ${SIDE[side]}の${t.pos}枚目は ${slotLabel(set, slot)} のはずです。記録と配列が合いません`;
  }
  t.entries.push(e);
  return pre + autoIdentify(m, side);
}
/* 自動振り分け：出たカードが左右どちらの「次」に合うかで筒を決める。
   決まらないときは ask を返し、画面で左右を選んでもらう */
function autoSideFor(m, no, star) {
  const set = S(m), key = no + (star ? '★' : '');
  const info = ['L', 'R'].map(s => {
    const t = m.tubes[s], arr = getArr(set, t.arrayId);
    if (!t.confirmed || !arr) return { s, state: 'unknown' };
    if (t.pos >= arr.slots.length) return { s, state: 'end' };
    return { s, state: arr.slots[t.pos].includes(key) ? 'match' : 'nomatch', next: arr.slots[t.pos], at: t.pos + 1 };
  });
  const match = info.filter(x => x.state === 'match');
  if (match.length === 1) return { side: match[0].s, info };
  if (match.length === 2) return { ask: true, reason: '左右どちらの次も同じカードです。どちらから出ましたか？', info };
  const open = info.filter(x => x.state === 'unknown' || x.state === 'end');
  if (open.length === 1) return { side: open[0].s, info };     // 配列が決まっていない(または100枚目まで出た)筒から出たとみなす
  if (open.length === 2) return { ask: true, reason: '左右とも配列が決まっていないので判定できません。どちらから出ましたか？', info };
  return { ask: true, reason: '左右どちらの次とも合いません。見間違い・入れ忘れでなければ、どちらから出ましたか？', info };
}
function coreStep(m, side, d) {
  const set = S(m), t = m.tubes[side], arr = getArr(set, t.arrayId);
  if (t.confirmed && arr) {
    const np = clamp(t.pos + d, 0, arr.slots.length);
    if (np === t.pos) return false;
    t.pos = np;
    return `${SIDE[side]}の目印：${t.pos}枚目まで出た`;
  }
  if (d > 0) { t.entries.push({ no: null, ts: Date.now() }); return '不明なカードを1枚進めました。' + autoIdentify(m, side); }
  if (!t.entries.length) return false;
  const e = t.entries.pop();
  return e.no ? `記録を1枚取り消しました(${entryKey(e)})` : '1枚戻しました';
}

/* =========================================================
   画面
   ========================================================= */
function thumbHTML(set, key) {
  const keys = Array.isArray(key) ? key : [key];
  if (keys.length > 1) {
    const rs = slotRarities(set, keys);
    return `<div class="thumb multi" style="${bgStyle(rs)}"><div class="mtxt">《ランダム》<br>${keys.length <= 3 ? keys.map(k => esc(shortNo(k))).join('<br>') : esc(keys.length + '種')}</div></div>`;
  }
  const k = keys[0];
  const { no, star } = splitKey(k);
  const c = set.byNo[no];
  const r = keyRarity(set, k);
  const img = c && c.image ? `<img loading="lazy" alt="" src="${esc(c.image)}" onerror="this.parentNode.classList.add('noimg')">` : '';
  return `<div class="thumb ${rcls(r)} ${img ? '' : 'noimg'}">${img}<div class="fb">${esc(no)}<br>${esc(r)}</div>${star ? '<span class="star">★</span>' : ''}</div>`;
}
function statusText(m, side) {
  const set = S(m), t = m.tubes[side], arr = getArr(set, t.arrayId);
  if (t.confirmed && arr) return `配列${t.arrayId} ${t.pos}/${arr.slots.length}`;
  const r = identify(m, side);
  if (!r.known) return t.fresh ? '未確定(新しい筒)' : '未確定';
  return `未確定・候補${r.exact.length}`;
}
function nextInfo(set, arr, pos) {
  const res = { remain: arr.slots.length - pos, PR: null, ER: null, star: null };
  for (let i = pos; i < arr.slots.length; i++) {
    const rs = slotRarities(set, arr.slots[i]); const d = i + 1 - pos;
    if (res.PR == null && rs.includes('PR')) res.PR = { d, at: i + 1 };
    if (res.ER == null && rs.includes('ER')) res.ER = { d, at: i + 1 };
    if (res.star == null && rs.some(r => r.endsWith('★'))) res.star = { d, at: i + 1 };
  }
  return res;
}
function statsHTML(set, arr, pos) {
  const n = nextInfo(set, arr, pos);
  const cell = (lab, cls, v) => `<div class="${cls}">${lab}<b>${v ? v.d : '−'}</b></div>`;
  return `<div class="stats"><div>残り<b>${n.remain}</b></div>${cell('PRまで', 'r-PR', n.PR)}${cell('ERまで', 'r-ER', n.ER)}${cell('★まで', 'r-PRs', n.star)}</div>`;
}

/* 上のパネル：次に出るパラレル(★)の画像・番号・名前・買取価格 */

function candHTML(side, c) {

/* ---- 期待値・並ぶ位置 ----
   左右どちらから出るかはランダム(偏りの強さ streak = 前と同じ筒から出る確率。0.5 なら半々)。
   前の人は「上限まで」「PR以上が出るまで(上限あり)」「1枚だけ」のどれかを割合で選び、
   実際の配列の並びでくじを何千回も引いて、自分が○人目に並んだときの★の確率と期待値を出す。 */
const EV_DEF = { max: 20, cost: 100, mixMax: 50, mixGood: 30, mixOne: 20, streak: 0.5, mine: 'stop', people: 12 };
function evConf(m) { m.ev = Object.assign({}, EV_DEF, m.ev || {}); return m.ev; }
function prices() { return store.prices || (store.prices = {}); }

/* 自分で入れた価格 → 参考価格(買取表) → 0円 の順 */
function priceOf(set, key) {

  if (u != null && u !== '') return +u || 0;
  const r = refPrice(set, key);
  return r != null ? r : 0;
}
/* 筒ごとに「残りの枠」を、引いたときの情報(★か・値段・PR以上か)の候補リストにしておく */
function tubePlan(set, t) {
  const arr = t.confirmed ? getArr(set, t.arrayId) : null;
  if (!arr) return { slots: [], pos: 0 };
  return {
    pos: t.pos,
    slots: arr.slots.map(slot => slot.map(k => ({ star: k.endsWith('★'), val: priceOf(set, k), good: (RANK[keyRarity(set, k)] || 0) >= 2 })))

const UNKNOWN_GOOD = 0.14;   // 未確定の筒・次の筒から出るカードが PR 以上になる割合(100枚中およそ14枚)
function simulateEV(m, runs) {
  const set = S(m), c = evConf(m);
  const plans = [tubePlan(set, m.tubes.L), tubePlan(set, m.tubes.R)];
  const tot = (+c.mixMax || 0) + (+c.mixGood || 0) + (+c.mixOne || 0) || 1;
  const pMax = (+c.mixMax || 0) / tot, pGood = (+c.mixGood || 0) / tot;
  const max = Math.max(1, Math.floor(+c.max || 1)), streak = clamp(+c.streak || 0.5, 0, 1);
  const Q = clamp(Math.floor(+c.people || 12), 1, 40);
  const res = [];
  for (let k = 0; k < Q; k++) {
    let hit = 0, val = 0, plays = 0, before = 0;
    for (let r = 0; r < runs; r++) {
      const pos = [plans[0].pos, plans[1].pos];
      let last = Math.random() < 0.5 ? 0 : 1;
      const draw = () => {
        const ti = Math.random() < streak ? last : 1 - last;
        last = ti;
        const p = pos[ti]++;
        const sl = plans[ti].slots[p];
        if (!sl) return { star: false, val: 0, good: Math.random() < UNKNOWN_GOOD };
        return sl.length === 1 ? sl[0] : sl[Math.floor(Math.random() * sl.length)];
      };
      for (let q = 0; q < k; q++) {
        const u = Math.random();
        const type = u < pMax ? 0 : u < pMax + pGood ? 1 : 2;
        const n = type === 2 ? 1 : max;
        for (let i = 0; i < n; i++) { const d = draw(); before++; if (type === 1 && d.good) break; }
      }
      let got = false;
      for (let i = 0; i < max; i++) {
        const d = draw(); plays++; val += d.val;      // 自分が引いたカードの買取価格を全部足す
        if (d.star) { got = true; if (c.mine === 'stop') break; }
      }
      if (got) hit++;

    res.push({ k, p: hit / runs, val: val / runs, cost: plays / runs * (+c.cost || 0), plays: plays / runs, before: before / runs });
  }
  return res;
}

function renderEvResult() {
  const m = M(), set = S(m), c = evConf(m);
  const out = $('#evRes');
  const tL = m.tubes.L, tR = m.tubes.R;
  if (!tL.confirmed && !tR.confirmed) { out.innerHTML = '<div class="box"><p class="hint" style="margin:0">左右どちらかの筒の配列が決まると計算できます。入力タブでカードを記録してください。</p></div>'; return; }
  const ns = side => {
    const t = m.tubes[side], n = nextStarInfo(set, t);
    if (!n) return `<div><b>${SIDE[side]}</b><br><span class="hint">未確定</span></div>`;
    if (n.none) return `<div><b>${SIDE[side]}</b> 配列${t.arrayId}<br>この筒にはもう★なし</div>`;
    const names = n.slot.length === 1 ? n.slot[0] : `《ランダム》${n.slot.length}種`;
    return `<div><b>${SIDE[side]}</b> 配列${t.arrayId}<br>★まで あと<b style="font-size:17px">${n.d}</b>枚(${n.at}枚目)<br><small>${esc(names)}・${n.avg ? Math.round(n.avg).toLocaleString() + '円' : '<span style="color:var(--ng)">価格未入力</span>'}</small></div>`;
  };
  const runs = 3000;
  const t0 = performance.now();
  const rs = simulateEV(m, runs);
  const ms = Math.round(performance.now() - t0);
  const anyPrice = starKeys(set).some(k => priceOf(set, k) > 0);
  const best = anyPrice ? rs.reduce((b, r) => (r.val - r.cost > b.val - b.cost ? r : b), rs[0]) : rs.reduce((b, r) => (r.p > b.p ? r : b), rs[0]);
  const maxP = Math.max(...rs.map(r => r.p), 0.001);
  const yen = v => (v < 0 ? '−' : '') + Math.abs(Math.round(v)).toLocaleString() + '円';
  out.innerHTML = `<div class="box"><h3>並ぶ位置と★の確率</h3>

    ${rs.map(r => `<tr class="${r === best ? 'best' : ''}"><td>${r.k === 0 ? '今すぐ' : `前に${r.k}人`}</td><td><span class="bar" style="width:${Math.round(r.p / maxP * 40)}px"></span>${Math.round(r.p * 100)}%</td><td class="${anyPrice ? (r.val - r.cost >= 0 ? 'pos' : 'neg') : ''}">${anyPrice ? yen(r.val - r.cost) : '−'}</td><td>約${Math.round(r.before)}枚</td></tr>`).join('')}
    </tbody></table>
    <p class="hint">期待値＝自分が引くカード(★以外も含む)の買取価格の合計 − 自分が払う額(平均${rs.length ? rs[0].plays.toFixed(1) : '-'}枚〜${Math.max(...rs.map(r => r.plays)).toFixed(1)}枚×${(+c.cost || 0).toLocaleString()}円)。${set.ref ? `価格は${esc(set.ref.source)}(${esc(set.ref.checked)})と、下で入力した値です。` : ''}${anyPrice ? '' : '<b>★の買取価格を下で入れると期待値が出ます。</b>'}<br>くじを${runs.toLocaleString()}回ずつ試した結果なので、数%はぶれます(${ms}ms)。偏りが強いときは、表よりずれやすくなります。</p></div>`;
}

/* ---- 全体 ---- */
function render(forceGrid) {
  renderHeader(); renderInbar(); renderNext(); renderPad();
  document.querySelectorAll('.tab').forEach(s => s.hidden = s.id !== 'tab-' + store.ui.tab);
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === store.ui.tab));
  switch (store.ui.tab) {
    case 'input': renderIdent(); renderChips(); renderGrid(forceGrid); break;
    case 'table': renderTable(); break;
    case 'search': renderSearch(); break;
    case 'ev': if (!document.querySelector('#evForm [data-ev]') || evFormFor !== M().id) { renderEvForm(); evFormFor = M().id; } renderEvResult(); break;
    case 'log': renderLog(); break;
    case 'settings': renderSettings(); break;
  }
}
let evFormFor = null;
let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), msg.startsWith('⚠') ? 4500 : 2600);
}
function saveUI() { save(); }
function download(name, text) {
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function ymd() { const d = new Date(); return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`; }
function validRaw(o) {
  return o && Array.isArray(o.cards) && Array.isArray(o.arrays) && o.cards.every(c => c && typeof c.no === 'string') &&
    o.arrays.every(a => a && Array.isArray(a.slots) && a.slots.every(s => Array.isArray(s) && s.length && s.every(k => typeof k === 'string')));
}
function importText(text) {
  const o = parseJSON(text);
  if (!o) { toast('JSONとして読めませんでした'); return; }
  if (o.app === 'aikatsu-hairetsu' && o.store && Array.isArray(o.store.machines)) {
    if (!confirm(`バックアップ(${fmtTime(o.exported)} 書き出し、筐体${o.store.machines.length}台)を読み込みます。今の状態は置き換わります。よろしいですか？`)) return;
    const wasEmpty = !Object.keys(SETS).length;
    dataOverride = Object.assign({}, dataOverride, o.dataOverride || {});   // 先に読み込んだ配列データは消さない
    lsSet(LS_DATA, JSON.stringify(dataOverride)); buildSets();
    if (!Object.keys(SETS).length) { lsSet(LS_KEY, JSON.stringify(o.store)); toast('記録を読み込みました。続けて配列データを読み込んでください'); return; }
    store = o.store; store.machines.forEach(fixMachine);
    store.ui = Object.assign({ tab: 'settings', side: 'L', sync: true, rowFilter: 'all', rarF: [], starMode: false, nextOpen: true }, store.ui || {});
    if (!store.machines.some(x => x.id === store.cur)) store.cur = store.machines[0].id;
    undoMap = {}; evFormFor = null;
    save();
    if (wasEmpty) { location.reload(); return; }
    render(true); toast('バックアップを読み込みました');
    return;
  }
  if (validRaw(o)) {
    const mm = (o.cards[0].no || '').match(/^(E\d+)-/);
    const id = mm ? mm[1] : 'E1';
    const exists = !!SETS[id];
    if (!confirm(`配列データ(${id}：カード${o.cards.length}枚、配列${o.arrays.length}個${o.refPrices ? '、買取価格つき' : ''})を${exists ? '差し替え' : '追加し'}ます。よろしいですか？`)) return;
    const wasEmpty = !Object.keys(SETS).length;
    dataOverride[id] = { title: o.title || id, notes: o.notes || [], cards: o.cards, arrays: o.arrays, refPrices: o.refPrices || (exists && SETS[id].ref) || undefined };
    if (!lsSet(LS_DATA, JSON.stringify(dataOverride))) { toast('この端末に保存できませんでした'); return; }
    if (wasEmpty) { location.reload(); return; }      // データなしの画面から始めたときは開き直す
    buildSets(); lastGridKey = ''; evFormFor = null;
    store.machines.forEach(fixMachine); save();
    render(true); toast(`配列データ(${id})を読み込みました`);
    return;
  }
  toast('このアプリのバックアップでも配列データでもありません');
}

    delete dataOverride[set.id]; lsSet(LS_DATA, JSON.stringify(dataOverride)); buildSets(); lastGridKey = '';
    store.machines.forEach(fixMachine); save(); render(true); toast('内蔵データに戻しました');
  },
  desave() {
    const set = S(M()), a = getArr(set, +$('#deArr').value), i = +$('#deIdx').value;
    if (!a || !a.slots[i - 1]) { toast('枚数目が範囲外です'); return; }
    const parts = $('#deVal').value.split(/[,、，\s\/]+/).filter(Boolean);
    if (!parts.length) { toast('新しい中身を入れてください'); return; }
    const keys = [];
    for (const p of parts) {
      const c = parseCardNo(p, set.id);
      if (!c || !set.byNo[c.no]) { toast('カードが見つかりません：' + p); return; }
      keys.push(c.no + (c.star ? '★' : ''));
    }
    if (!confirm(`${a.name}の${i}枚目を「${keys.join(', ')}」にします。よろしいですか？`)) return;
    a.slots[i - 1] = [...new Set(keys)];
    saveOverride(set); $('#deVal').value = ''; render(); toast(`${a.name}の${i}枚目を保存しました`);
  },
  dcsave() {
    const set = S(M()), c = set.byNo[$('#dcNo').value]; if (!c) return;
    const name = $('#dcName').value.trim(); if (!name) { toast('名前を入れてください'); return; }

    saveOverride(set); render(); toast(c.no + ' を保存しました');
  },
};

  }

  else if (t.id === 'setSel') {
    if (!confirm('この筐体の弾を切り替えます。今の記録はリセットされます(「戻す」で取り消せます)。よろしいですか？')) { t.value = M().setId; return; }

    lastGridKey = '';
  }
  else if (t.dataset.ev) {
    const c = evConf(M()), k = t.dataset.ev;
    c[k] = k === 'mine' ? t.value : (k === 'streak' ? +t.value : Math.max(0, +t.value || 0));
    if (k === 'max' || k === 'people') c[k] = Math.max(1, Math.floor(c[k]));
    save(); renderEvResult();
  }
  else if (t.dataset.price) {
    const v = t.value.trim();
    if (v === '') delete prices()[t.dataset.price]; else prices()[t.dataset.price] = Math.max(0, +v || 0);
    save(); renderEvResult();
  }
  else if (t.id === 'deArr' || t.id === 'deIdx') updateDeCur();
  else if (t.id === 'dcNo') updateDc();
  else if (t.id === 'fileIn' && t.files && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => importText(String(fr.result));
    fr.readAsText(t.files[0], 'utf-8');
  }
});

/* =========================================================
   動作確認(index.html#selftest で開くと結果を表示。保存はしない)
   ========================================================= */
function runSelfTest() {
  const out = [];
  const log = (ok, msg) => out.push((ok ? 'OK  ' : 'NG  ') + msg);
  const set = SETS[firstSetId()];
  const slotOf = (a, i) => getArr(set, a).slots[i - 1];
  const rec = (m, side, key) => { const k = splitKey(key); return coreRecord(m, side, k.no, k.star); };
  const tm = () => { const m = newMachine('test', set.id); return m; };
  const st = (t) => `${t.confirmed ? '確定' : '未確定'} 配列${t.arrayId} ${t.pos}枚目`;
  out.push(`データ：${set.id} カード${set.cards.length}枚 配列${set.arrays.length}個`);

  // 1. 配列3の10〜13枚目
  {
    const keys = [10, 11, 12, 13].map(i => slotOf(3, i)[0]);
    const counts = keys.map((_, j) => findMatches(set, keys.slice(0, j + 1).map(k => ({ ...splitKey(k) })), 0).length);
    const m = tm(); const msgs = keys.map(k => rec(m, 'L', k));
    const t = m.tubes.L;
    log(t.confirmed && t.arrayId === 3 && t.pos === 13, `配列3の10〜13枚目 ${keys.join(',')} を入力 → ${st(t)}(候補数の推移 ${counts.join('→')})`);
    out.push('      メッセージ：' + msgs.join(' / '));
  }
  // 2. 複数候補の枠(配列7の9枚目 [E1-77,E1-79] を E1-79 で)
  {
    const m = tm();
    const keys = [6, 7, 8, 9, 10].map(i => i === 9 ? 'E1-79' : slotOf(7, i)[0]);
    keys.forEach(k => rec(m, 'L', k));
    const t = m.tubes.L;
    log(t.confirmed && t.arrayId === 7 && t.pos === 10, `複数候補の枠：配列7の6〜10枚目(9枚目《${slotOf(7, 9).join('/')}》を E1-79 で入力) → ${st(t)}`);
    const m2 = tm();
    const keys2 = [67, 68, 69, 70, 71, 72].map(i => i === 70 ? 'E1-45' : i === 69 ? 'E1-62' : slotOf(7, i)[0]);
    keys2.forEach(k => rec(m2, 'L', k));
    log(m2.tubes.L.confirmed && m2.tubes.L.arrayId === 7 && m2.tubes.L.pos === 72, `複数候補の枠：配列7の67〜72枚目(69枚目《E1-60/E1-62》→E1-62、70枚目《29種》→E1-45) → ${st(m2.tubes.L)}`);
    // 確定後に複数候補の枠を通過しても警告が出ないか
    const m3 = tm(); coreConfirm(m3, 'L', 7, 8); const msg = rec(m3, 'L', 'E1-77');
    log(!msg.startsWith('⚠') && m3.tubes.L.pos === 9 && mismatches(m3, 'L').length === 0, `確定後(配列7の8枚目)に E1-77 を記録 → 9枚目・警告なし「${msg}」`);
  }
  // 3. ★
  {
    const m = tm();
    const keys = [20, 21, 22, 23].map(i => slotOf(1, i)[0]);
    keys.forEach(k => rec(m, 'L', k));
    const t = m.tubes.L;
    log(t.confirmed && t.arrayId === 1 && t.pos === 23, `★：配列1の20〜23枚目(${keys.join(',')}) → ${st(t)}`);
    const ents = keys.map(k => ({ no: splitKey(k).no, star: false }));
    const ex = findMatches(set, ents, 0);
    log(!ex.some(c => c.arrayId === 1 && c.end === 23), `★なしの E1-35 で入力すると配列1の23枚目は完全一致にならない(完全一致 ${ex.length}件)`);
    const near = findMatches(set, ents, 1);
    log(near.some(c => c.arrayId === 1 && c.end === 23 && c.mis === 1), '　→ 近い候補(1枚違い)には配列1の23枚目が出る');
    const m2 = tm(); coreConfirm(m2, 'R', 8, 21); const msg = rec(m2, 'R', 'E1-34★');
    log(!msg.startsWith('⚠'), `確定後に配列8の22枚目《★4種》へ E1-34★ を記録 → 警告なし「${msg}」`);
    const nx = nextInfo(set, getArr(set, 1), 0);
    log(nx.star && nx.star.at === 22 && nx.star.d === 22, `配列1の0枚目から「★まで」= あと${nx.star && nx.star.d}(22枚目)、PRまで あと${nx.PR && nx.PR.d}(${nx.PR && nx.PR.at}枚目)、ERまで あと${nx.ER && nx.ER.d}(${nx.ER && nx.ER.at}枚目)`);
  }
  // 4. 100枚目 → 次の筒
  {
    const m = tm();
    coreConfirm(m, 'L', 5, 97);
    [98, 99, 100].forEach(i => rec(m, 'L', slotOf(5, i)[0]));
    const t = m.tubes.L;
    const at100 = t.pos === 100 && t.confirmed;
    const first6 = slotOf(6, 1)[0];
    const msg = rec(m, 'L', first6);
    log(at100 && t.cyl === 2 && t.history.length === 1 && t.history[0].arrayId === 5 && t.history[0].pos === 100,
      `配列5の98〜100枚目のあと ${first6} を記録 → 第${t.cyl}筒に自動切替、前の筒は履歴(配列${t.history[0].arrayId}・${t.history[0].pos}枚目まで・記録${t.history[0].entries.length}件)`);
    log(t.confirmed && t.arrayId === 6 && t.pos === 1, `　→ 新しい筒は1枚目からの一致を優先：${st(t)}「${msg}」`);
    const allCands = findMatches(set, [{ no: first6, star: false }], 0).length;
    out.push(`      (${first6} 1枚だけだと全体では${allCands}か所に一致するが、1枚目から一致するのは配列6だけ)`);
    // 全配列の1枚目
    let ok = 0;
    for (const a of set.arrays) { const mm = tm(); coreNextCyl(mm, 'L'); rec(mm, 'L', a.slots[0][0]); if (mm.tubes.L.confirmed && mm.tubes.L.arrayId === a.id && mm.tubes.L.pos === 1) ok++; }
    log(ok === set.arrays.length, `新しい筒の1枚目だけで配列が決まる：${ok}/${set.arrays.length}配列`);
  }
  // 5. ペアの優先
  {
    const m = tm();
    coreConfirm(m, 'L', 3, 13);
    const r0 = m.tubes.R.arrayId;
    rec(m, 'R', 'E1-41');
    const r = identify(m, 'R');
    log(r0 === 4 && r.exact.length > 1 && r.exact[0].arrayId === 4 && r.exact.some(c => c.arrayId !== 4),
      `ペア：左筒が配列3に確定 → 右筒の表示は配列${r0}。右筒に E1-41 → 候補${r.exact.length}件、先頭は配列${r.exact[0].arrayId}の${r.exact[0].end}枚目(ペア以外も${r.exact.filter(c => c.arrayId !== 4).length}件残す)`);
  }
  // 6. 番号検索
  {
    const qs = ['29', '1-29', 'E1-29', 'e1-29', '２９', '1ー29', '35★'];
    const res = qs.map(q => { const p = parseCardNo(q, 'E1'); return q + '→' + (p ? p.no + (p.star ? '★' : '') : '×'); });
    log(qs.slice(0, 6).every(q => parseCardNo(q, 'E1').no === 'E1-29') && parseCardNo('35★', 'E1').star, '番号検索：' + res.join(' '));
    const ps = positionsOf(set, 'E1-56').map(x => x.a.id + ':' + (x.ps.map(p => p.i).join('/') || 'なし')).join(' ');
    out.push('      E1-56 の位置：' + ps);
  }
  // 7. 見間違い(近い候補)
  {
    const m = tm();
    const keys = [10, 11, 12, 13, 14, 15].map(i => slotOf(3, i)[0]);
    keys[2] = 'E1-01';
    const ents = keys.map(k => ({ ...splitKey(k) }));
    const ex = findMatches(set, ents, 0);
    keys.forEach(k => { m.tubes.L.entries.push({ ...splitKey(k) }); });
    const r = identify(m, 'L');
    log(!ex.length && r.near.length && r.near[0].arrayId === 3 && r.near[0].end === 15, `見間違い：配列3の10〜15枚目のうち12枚目を E1-01 にすると完全一致0件、近い候補の先頭は配列${r.near[0] && r.near[0].arrayId}の${r.near[0] && r.near[0].end}枚目`);
  }
  // 8. 取り消し前提の操作：−1/＋1、不明カード
  {
    const m = tm();
    rec(m, 'L', slotOf(3, 10)[0]); coreStep(m, 'L', 1); rec(m, 'L', slotOf(3, 12)[0]); rec(m, 'L', slotOf(3, 13)[0]);
    const t = m.tubes.L;
    log(t.confirmed && t.arrayId === 3 && t.pos === 13, `不明な1枚(＋1)をはさむ：配列3の10、?、12、13 → ${st(t)}`);
    coreStep(m, 'L', -1);
    log(t.pos === 12, `確定後の −1 → 目印${t.pos}枚目`);
  }
  // 8b. 期待値の試行(配列1の0枚目から。★は22枚目。右は未確定。全員20枚ずつ、偏りなし)
  {
    const m = tm(); coreConfirm(m, 'L', 1, 0);
    m.ev = { max: 20, cost: 100, mixMax: 100, mixGood: 0, mixOne: 0, streak: 0.5, mine: 'max', people: 5 };
    const rs = simulateEV(m, 4000);
    const best = rs.reduce((b, r) => (r.p > b.p ? r : b), rs[0]);
    const sum = rs.reduce((s, r) => s + r.p, 0);
    log(best.k === 2 && Math.abs(sum - 1) < 0.05, `期待値：★が左筒の22枚目(平均44プレイ目)・全員20枚 → いちばん当たるのは前に${best.k}人(${Math.round(best.p * 100)}%)、確率の合計 ${sum.toFixed(2)}。人ごと：${rs.map(r => Math.round(r.p * 100) + '%').join(' / ')}`);
    m.ev.streak = 0.8;
    const rs2 = simulateEV(m, 4000);
    out.push(`      偏り強め(80%で同じ筒)：${rs2.map(r => Math.round(r.p * 100) + '%').join(' / ')}`);
  }
  // 8c. 左右の自動振り分け
  {
    const m = tm(); coreConfirm(m, 'L', 3, 12); coreConfirm(m, 'R', 4, 0);   // 左の次 E1-66、右の次 E1-41
    const a1 = autoSideFor(m, 'E1-66', false), a2 = autoSideFor(m, 'E1-41', false), a3 = autoSideFor(m, 'E1-01', false);
    log(a1.side === 'L' && a2.side === 'R' && a3.ask, `自動振り分け：左の次 E1-66→${a1.side}、右の次 E1-41→${a2.side}、どちらとも合わない E1-01→${a3.ask ? '聞く' : a3.side}`);
    const m2 = tm(); coreConfirm(m2, 'L', 1, 0); coreConfirm(m2, 'R', 3, 7);   // 左右とも次が E1-24
    const b = autoSideFor(m2, 'E1-24', false);
    log(b.ask && /同じ/.test(b.reason), `自動振り分け：左右の次が同じ(${slotOf(1, 1)}/${slotOf(3, 8)}) → 聞く`);
    const m3 = tm(); coreConfirm(m3, 'L', 3, 12);   // 右は未確定
    const c1 = autoSideFor(m3, 'E1-66', false), c2 = autoSideFor(m3, 'E1-01', false);
    log(c1.side === 'L' && c2.side === 'R', `自動振り分け：右が未確定のとき、左の次 E1-66→${c1.side}、合わない E1-01→${c2.side}(未確定の筒の特定に使う)`);
    const m4 = tm(); coreConfirm(m4, 'L', 5, 100); coreConfirm(m4, 'R', 4, 0);   // 左は100枚目まで出た
    const d1 = autoSideFor(m4, 'E1-62', false);
    log(d1.side === 'L', `自動振り分け：左が100枚目まで出ていて右の次と合わない → ${d1.side}(左の次の筒)`);
  }
  // 9. 全件：どこから入れても正しい答えが候補に残り、何枚で1つに決まるか
  {
    let wrong = 0, notU = 0, total = 0;
    const hist = {};
    for (const a of set.arrays) {
      for (let s = 1; s <= a.slots.length - 9; s++) {
        total++;
        const ents = []; let got = null;
        for (let i = s; i <= a.slots.length && ents.length < 20; i++) {
          ents.push({ ...splitKey(a.slots[i - 1][a.slots[i - 1].length - 1]) });
          const ex = findMatches(set, ents, 0);
          if (!ex.some(c => c.arrayId === a.id && c.end === i)) { wrong++; break; }
          if (ex.length === 1) { got = ents.length; break; }
        }
        if (got == null) notU++; else hist[got] = (hist[got] || 0) + 1;
      }
    }
    log(wrong === 0, `全${total}か所(各配列の1〜91枚目から入力開始)：正しい答えが候補から消えた件数 ${wrong}`);
    const ks = Object.keys(hist).map(Number).sort((a, b) => a - b);
    let cum = 0;
    out.push('      1つに決まるまでの枚数：' + ks.map(k => { cum += hist[k]; return `${k}枚で${hist[k]}件(累計${Math.round(cum / total * 100)}%)`; }).join('、') + (notU ? `、決まらず${notU}件` : ''));
  }
  return out.join('\n');
}
if (location.hash === '#selftest') {
  document.body.insertAdjacentHTML('afterbegin', '<pre id="selftest">' + esc(runSelfTest()) + '</pre>');
}

/* =========================================================
   暗号化した配列データ(サーバー用)
   パスワード → PBKDF2-SHA256 で鍵 → AES-GCM で復号。「この端末に記憶」なら鍵だけを保存する(パスワードは保存しない)
   ========================================================= */
const ENC = parseJSON(document.getElementById('enc-data').textContent);
const LS_ENCKEY = 'aikatsuHairetsu.enckey.v1';
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u8 => { let s = ''; u8.forEach(b => { s += String.fromCharCode(b); }); return btoa(s); };
const hasSubtle = () => !!(window.crypto && crypto.subtle);
async function deriveRaw(pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64d(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' }, base, 256));
}
async function decryptRaw(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(ENC.iv) }, key, b64d(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function useDecrypted(d) {
  BUILTIN.sets = Array.isArray(d.sets) ? d.sets : [];
  buildSets(); lastGridKey = ''; evFormFor = null;
  store.machines.forEach(fixMachine);
}
function showUnlock() {
  document.body.classList.add('nodata');
  document.body.insertAdjacentHTML('beforeend', `<div id="nodataBox" class="box">
    <h3>パスワードを入れてください</h3>
    <p style="font-size:14px;line-height:1.6">配列データはパスワードで暗号化してあります。設定したパスワードを入れると使えるようになります。</p>
    <form id="unlockForm" autocomplete="on" onsubmit="return false">
      <input type="text" name="username" value="aikatsu-hairetsu" autocomplete="username" hidden>
      <input id="unlockPw" type="password" autocomplete="current-password" placeholder="パスワード" style="width:100%;height:46px;border:2px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface)">
      <label style="display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px"><input id="unlockRemember" type="checkbox" checked style="width:22px;height:22px"> この端末に記憶する(次から入力しなくてよい)</label>
      <div class="btnrow"><button class="btn pri" id="unlockBtn" type="submit" data-act="unlock">開く</button></div>
    </form>
    <p class="hint">${hasSubtle() ? '' : '<b style="color:var(--ng)">この開き方(https でないアドレス)では暗号を解けません。https のアドレスで開いてください。</b><br>'}手元に配列データのファイルがあるときは、<a href="#" data-act="import">ファイルから読み込む</a>こともできます。</p>
    <p class="hint">iPhone の Safari は、7日間開かなかったサイトの保存データを消すことがあります。共有ボタンから「ホーム画面に追加」して使うと安心です。</p>
  </div>`);
  setTimeout(() => { const el = $('#unlockPw'); if (el) el.focus(); }, 100);
}
ACT.unlock = async () => {
  const pw = $('#unlockPw').value;
  if (!pw) { toast('パスワードを入れてください'); return; }
  if (!hasSubtle()) { toast('https のアドレスで開いてください'); return; }
  const btn = $('#unlockBtn'); btn.disabled = true; btn.textContent = '確認中…';
  try {
    const raw = await deriveRaw(pw);
    const d = await decryptRaw(raw);
    if ($('#unlockRemember').checked) lsSet(LS_ENCKEY, b64e(raw));
    $('#nodataBox').remove(); document.body.classList.remove('nodata');
    useDecrypted(d); start(); toast('配列データを開きました');
  } catch (e) {
    btn.disabled = false; btn.textContent = '開く';
    toast('パスワードが違います');
  }
};
ACT.forgetkey = () => {
  if (!confirm('この端末に記憶したパスワード(鍵)を消します。次に開くときにパスワードを入れ直します。よろしいですか？')) return;
  try { localStorage.removeItem(LS_ENCKEY); } catch (e) { }
  location.reload();
};

/* 起動 */
function showNoData() {
  /* 配列データなし：データを読み込む画面だけ出す。データはこの端末の中だけに保存される */
  document.body.classList.add('nodata');
  document.body.insertAdjacentHTML('beforeend', `<div id="nodataBox" class="box">
    <h3>配列データを読み込んでください</h3>
    <p style="font-size:14px;line-height:1.6">このアプリには配列データが入っていません。手元の配列データのファイル(例：aikatsu_e1_data.json)を読み込むと使えるようになります。読み込んだデータはこの端末の中だけに保存され、サーバーには送られません。</p>
    <div class="btnrow"><button class="btn pri" data-act="import">配列データを読み込む</button></div>
    <p class="hint">前の記録(バックアップのファイル)があれば、配列データの前でも後でも読み込めます。</p>
    <p class="hint">iPhone の Safari は、7日間開かなかったサイトの保存データを消すことがあります。共有ボタンから「ホーム画面に追加」して使うと安心です。</p>
  </div>`);
}
function start() {
  if (!Object.keys(SETS).length) { showNoData(); return; }
  render(true);
  if (store.ui.tab === 'table') requestAnimationFrame(() => { sizeCols(); jumpToMarker(store.ui.sync ? store.ui.side : null); ACT.jump(); });
}
async function boot() {
  // 埋め込みデータも読み込んだデータもなく、暗号化データがあるときだけパスワードを使う
  if (!Object.keys(SETS).length && ENC && ENC.ct) {
    const saved = lsGet(LS_ENCKEY);
    if (saved && hasSubtle()) {
      try { useDecrypted(await decryptRaw(b64d(saved))); start(); return; } catch (e) { /* パスワードが変わった：入れ直し */ }
    }
    showUnlock();
    return;
  }
  start();
}
boot();
/* オフライン対応(サーバーに置いた https の版だけ。127.0.0.1 は動作確認用) */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === '127.0.0.1')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
